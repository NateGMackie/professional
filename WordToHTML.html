<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word → Clean HTML (keep headings, lists, tables, <strong>/<em>)</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #0b1020; color: #e6eef8; }
    header { padding: 12px 16px; background: #121933; border-bottom: 1px solid #1e2748; }
    header h1 { margin: 0; font-size: 16px; }
    .wrap { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
    .panel { flex: 1 1 45%; background: #121933; border-radius: 8px; border: 1px solid #1e2748; display: flex; flex-direction: column; }
    .panel h2 { font-size: 14px; margin: 0; padding: 8px 12px; border-bottom: 1px solid #1e2748; color: #9fb3c8; }
    .panel .body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    #pasteZone { border: 1px dashed #2a3566; background: #0e1736; border-radius: 6px; min-height: 120px; padding: 10px; color: #9fb3c8; }
    pre.code { background: #0a132f; border: 1px solid #223064; border-radius: 6px; padding: 10px; color: #e6eef8; font-family: monospace; white-space: pre-wrap; word-wrap: break-word; }
    iframe.preview { flex: 1; border: 0; background: #fff; border-radius: 6px; min-height: 200px; }
    button { background: #172350; color: #e6eef8; border: 1px solid #2a3a7a; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1b2a63; }
  </style>
</head>
<body>
  <header><h1>Word → Clean HTML</h1></header>
  <div class="wrap">
    <section class="panel">
      <h2>1) Paste Word content</h2>
      <div class="body">
        <div id="pasteZone" contenteditable="true">Paste from Word here…</div>
        <button id="btnClean">Clean Now</button>
      </div>
    </section>
    <section class="panel">
      <h2>2) Clean HTML & Preview</h2>
      <div class="body">
        <pre id="out" class="code"></pre>
        <iframe id="preview" class="preview"></iframe>
      </div>
    </section>
  </div>
  <script>
    function cleanHTML(inputHTML) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(inputHTML, 'text/html');

      // Remove comments
      const walker = document.createTreeWalker(doc, NodeFilter.SHOW_COMMENT);
      const comments = [];
      while (walker.nextNode()) comments.push(walker.currentNode);
      comments.forEach((c) => c.remove());

      // Remove Word/Office namespaced elements (o:, v:, w:, m:)
      Array.from(doc.getElementsByTagName('*')).forEach((el) => {
        const tn = el.tagName;
        const idx = tn.indexOf(':');
        if (idx > 0) {
          const prefix = tn.slice(0, idx).toLowerCase();
          if (["o", "v", "w", "m"].includes(prefix)) el.remove();
        }
      });

      // Remove style/meta/link/script/xml tags
      doc.querySelectorAll('style,meta,link,script,xml').forEach((el) => el.remove());

      // Convert MsoHeading paragraphs to headings
      doc.querySelectorAll('p[class^="MsoHeading"]').forEach((p) => {
        const match = /MsoHeading([1-6])/.exec(p.className);
        if (match) {
          const h = doc.createElement('h' + match[1]);
          h.innerHTML = p.innerHTML;
          p.replaceWith(h);
        }
      });

      // Normalize <b>/<i> to <strong>/<em>
      doc.querySelectorAll('b').forEach((b) => {
        const strong = doc.createElement('strong');
        strong.innerHTML = b.innerHTML;
        b.replaceWith(strong);
      });
      doc.querySelectorAll('i').forEach((i) => {
        const em = doc.createElement('em');
        em.innerHTML = i.innerHTML;
        i.replaceWith(em);
      });

      // Preserve <u>

      // Convert fake lists into real lists (handle bullets, numbers, nested)
      function processLists(root) {
        const nodes = Array.from(root.childNodes);
        const frag = doc.createDocumentFragment();
        let currentList = null;
        let lastIndent = 0;

        nodes.forEach((n) => {
          if (n.nodeType === Node.ELEMENT_NODE && n.tagName === 'P') {
            const text = n.textContent.replace(/\u00A0/g, ' ').trim();
            const indent = (n.getAttribute('style')||'').match(/margin-left:([\d.]+)pt/);
            const level = indent ? Math.round(parseFloat(indent[1])/18) : 0; // ~18pt per level
            let type = null;
            if (/^\d+[\.|\)]/.test(text)) type = 'ol';
            else if (/^[\u2022\u00B7\-*]/.test(text)) type = 'ul';
            if (type) {
              if (!currentList || currentList.tagName.toLowerCase() !== type || level !== lastIndent) {
                currentList = doc.createElement(type);
                frag.appendChild(currentList);
                lastIndent = level;
              }
              const li = doc.createElement('li');
              li.innerHTML = text.replace(/^([\d]+[\.|\)]\s*|[\u2022\u00B7\-*]\s*)/, '');
              currentList.appendChild(li);
              return;
            }
          }
          // Reset list if normal paragraph
          currentList = null;
          frag.appendChild(n.cloneNode(true));
        });

        root.innerHTML = '';
        root.appendChild(frag);
      }
      processLists(doc.body);

      // Strip table border attributes
      doc.querySelectorAll('table').forEach((tbl) => tbl.removeAttribute('border'));

      return doc.body.innerHTML.trim();
    }

    document.getElementById('btnClean').addEventListener('click', () => {
      const input = document.getElementById('pasteZone').innerHTML;
      const cleaned = cleanHTML(input);
      document.getElementById('out').textContent = cleaned;
      document.getElementById('preview').srcdoc = cleaned;
    });
  </script>
</body>
</html>
