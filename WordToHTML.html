<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word → Clean HTML (keep headings, lists, tables, <strong>/<em>)</title>
  <style>
    :root{
      --bg:#0b1020;--panel:#121933;--panel-border:#1e2748;--text:#e6eef8;--muted:#9fb3c8;--accent:#172350;--accent-2:#1b2a63;--dashed:#2a3566;--code-bg:#0a132f;--code-br:#223064;
    }
    *{box-sizing:border-box}
    body{font-family:sans-serif;margin:0;background:var(--bg);color:var(--text)}
    header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--panel-border)}
    header h1{margin:0;font-size:16px}
    .wrap{display:flex;flex-wrap:wrap;gap:16px;padding:16px}
    .panel{flex:1 1 45%;background:var(--panel);border-radius:8px;border:1px solid var(--panel-border);display:flex;flex-direction:column;min-width:320px}
    .panel h2{font-size:14px;margin:0;padding:8px 12px;border-bottom:1px solid var(--panel-border);color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .panel .body{padding:12px;flex:1;display:flex;flex-direction:column;gap:12px}

    #pasteZone{border:1px dashed var(--dashed);background:#0e1736;border-radius:6px;min-height:160px;padding:10px;color:var(--muted)}
    pre.code{background:var(--code-bg);border:1px solid var(--code-br);border-radius:6px;padding:10px;color:var(--text);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;white-space:pre-wrap;word-wrap:break-word;min-height:200px}
    iframe.preview{flex:1;border:0;background:#fff;border-radius:6px;min-height:200px}
    button{background:var(--accent);color:var(--text);border:1px solid #2a3a7a;padding:6px 10px;border-radius:6px;cursor:pointer}
    button:hover{background:var(--accent-2)}

    /* Toggle */
    .toggle{display:inline-flex;background:#0e1736;border:1px solid var(--panel-border);border-radius:8px;overflow:hidden}
    .toggle button{border:0;background:transparent;color:var(--muted);padding:6px 10px}
    .toggle button[aria-pressed="true"]{background:#18224a;color:var(--text)}

    .row{display:flex;gap:8px;flex-wrap:wrap}
    .spacer{flex:1}

    .hidden{display:none !important}
  </style>
</head>
<body>
  <header><h1>Word → Clean HTML</h1></header>
  <div class="wrap">
    <!-- Left: Input -->
    <section class="panel">
      <h2>
        <span>1) Paste Word content</span>
        <span class="row" role="group" aria-label="Paste Content">
          <button id="btnClean" title="Clean the pasted content">Clean Now</button>
          <span class="spacer"></span>
          <button id="btnClear" title="Clear input and output">Clear</button>
        </span>

      </h2>
      <div class="body">
        <div id="pasteZone" contenteditable="true" aria-label="Paste from Word here">Paste from Word here…</div>
      </div>
    </section>

    <!-- Right: Output with Toggle -->
    <section class="panel">
      <h2>
  <span>2) Output</span>
  <span class="row" role="group" aria-label="Output controls">
    <span class="toggle" role="group" aria-label="Output view">
      <button id="btnShowPreview" aria-pressed="true">Preview</button>
      <button id="btnShowCode" aria-pressed="false">HTML</button>
    </span>
    <button id="btnCopy" title="Copy HTML to clipboard">Copy</button>
  </span>
</h2>

      <div class="body">
        <pre id="out" class="code hidden" aria-label="Clean HTML code"></pre>
        <iframe id="preview" class="preview" title="Rendered preview"></iframe>
      </div>
    </section>
  </div>

<script>
// ===== Modular Word → Clean HTML pipeline =====
function parseHTML(input){
  const parser = new DOMParser();
  return parser.parseFromString(input,'text/html');
}

function removeHtmlComments(doc){
  const walker = document.createTreeWalker(doc, NodeFilter.SHOW_COMMENT);
  const comments = [];
  while (walker.nextNode()) comments.push(walker.currentNode);
  comments.forEach(c=>c.remove());
}
function removeOfficeNamespaces(doc){
  Array.from(doc.getElementsByTagName('*')).forEach(el=>{
    const tn = el.tagName, idx = tn.indexOf(':');
    if (idx>0){
      const prefix = tn.slice(0,idx).toLowerCase();
      if (["o","v","w","m"].includes(prefix)) el.remove();
    }
  });
}
function removeDangerousNodes(doc){
  doc.querySelectorAll('style,meta,link,script,xml').forEach(el=>el.remove());
}

// Strip Word “review comments” artifacts
function removeWordComments(doc){
  doc.querySelectorAll([
    'span.MsoCommentReference',
    'a[style*="mso-comment-reference"]',
    'a[href^="#_msocom_"]',
    'a[name^="_msocom_"]',
    'a[href^="#cmnt"]'
  ].join(',')).forEach(n=>{
    const p = n.parentElement;
    n.remove();
    if (p && p.tagName === 'SUP' && p.textContent.trim()==='') p.remove();
  });
  doc.querySelectorAll([
    'div.MsoCommentText',
    'style#msocomments',
    '[id^="_com_"]',
    '[id^="cmnt"]'
  ].join(',')).forEach(n=>n.remove());
  doc.querySelectorAll('hr.msocomoff, hr[id^="_com_"], hr[id^="msocom"]').forEach(hr=>{
    const p = hr.parentElement; hr.remove();
    if (p && p.textContent.trim()==='' && p.children.length===0) p.remove();
  });
  doc.querySelectorAll('p').forEach(p=>{
    if (/^\s*Comment\s*\[[^\]]+\]\s*:/.test(p.textContent||'')) p.remove();
  });
}

function convertMsoHeadings(doc){
  doc.querySelectorAll('p[class^="MsoHeading"]').forEach(p=>{
    const m = /MsoHeading([1-6])/.exec(p.className||'');
    if (m){ const h = doc.createElement('h'+m[1]); h.innerHTML = p.innerHTML; p.replaceWith(h); }
  });
}

function normalizeInlineFormatting(doc){
  doc.querySelectorAll('b').forEach(b=>{ const strong = doc.createElement('strong'); strong.innerHTML=b.innerHTML; b.replaceWith(strong); });
  doc.querySelectorAll('i').forEach(i=>{ const em = doc.createElement('em'); em.innerHTML=i.innerHTML; i.replaceWith(em); });
}

// Remove Word's Mso* classes and mso-* inline styles (run AFTER list/heading detection!)
function removeMsoStyling(doc){
  doc.querySelectorAll('[class]').forEach(el=>{
    const kept = (el.className||'').split(/\s+/).filter(Boolean).filter(c=>!/^mso/i.test(c));
    if (kept.length) el.className = kept.join(' ');
    else el.removeAttribute('class');
  });
  doc.querySelectorAll('[style]').forEach(el=>{
    const style = el.getAttribute('style')||'';
    const kept = style.split(';').map(s=>s.trim()).filter(Boolean).filter(rule=>{
      const name = (rule.split(':')[0]||'').trim().toLowerCase();
      return name &&
        !name.startsWith('mso-') && !name.startsWith('-mso-') &&
        name !== 'tab-stops' && name !== 'page-break-before' && name !== 'page-break-after';
    });
    if (kept.length) el.setAttribute('style', kept.join('; '));
    else el.removeAttribute('style');
  });
}

// ---- List conversion helpers (handles real Word levels + style-change heuristics) ----
function getListInfo(p){
  const cls   = p.className || '';
  const style = (p.getAttribute('style')||'').toLowerCase();
  const text  = (p.textContent||'').trim();

  // Word flags
  const hasWordFlag = /mso-list/.test(style) || /MsoListParagraph/i.test(cls);

  // Parse explicit Word list id + level:  mso-list:l0 level2 lfo1
  let listId = null;
  let level  = null;
  const mWord = /mso-list:\s*l(\d+)\s+level(\d+)/i.exec(style);
  if (mWord){
    listId = Number(mWord[1]);
    level  = Math.max(1, parseInt(mWord[2], 10));
  }

  // Fallback: "levelN" elsewhere
  if (level == null){
    const mLevel = /level\s*([0-9]+)/i.exec(style);
    if (mLevel) level = Math.max(1, parseInt(mLevel[1], 10));
  }

  // As a last resort, infer from margin-left
  if (level == null){
    const mMargin = /margin-left:\s*([0-9.]+)\s*([a-z%]+)/.exec(style);
    if (mMargin){
      let px = parseFloat(mMargin[1]); const unit = mMargin[2];
      if (unit==='in') px*=96; else if (unit==='pt') px*=1.333; else if (unit==='cm') px*=37.8;
      else if (unit==='mm') px*=3.78; else if (unit==='em') px*=16; else if (unit==='%') px=0;
      level = Math.max(1, Math.min(8, Math.round(px/18)+1));
    }
  }
  if (level == null) level = 1;

  // Determine list type from visible marker
  const bulletRe  = /^[\u2022\u00B7\u2219\u25AA\u25CF\-*]/;
  const orderedRe = /^(?:\d+|[A-Za-z]+|[ivxlcdm]+)[.)]/i;
  if (!(hasWordFlag || bulletRe.test(text) || orderedRe.test(text))) return null;

  const type = bulletRe.test(text) ? 'ul' : 'ol';

  // Optional: cosmetics + heuristics
  let styleType = null;
  if (type==='ol'){
    if (/^[a-z][.)]/.test(text)) styleType = 'lower-alpha';
    else if (/^[A-Z][.)]/.test(text)) styleType = 'upper-alpha';
    else if (/^(?:[ivxlcdm]+)[.)]/i.test(text)) styleType = 'lower-roman';
  }

  return { type, level, styleType, listId };
}

function stripListMarkersDOM(p){
  // 1) Remove Word marker helper spans everywhere in <p>
  p.querySelectorAll('span').forEach(s=>{
    const st = (s.getAttribute('style')||'').toLowerCase();
    const onlyNbsp = !s.firstElementChild && /^\s*&nbsp;*\s*$/i.test(s.innerHTML);
    if (/mso-list\s*:\s*ignore/.test(st) || (/font-size:\s*7pt/.test(st) && onlyNbsp)) {
      s.remove();
    }
  });

  // Bullet or number/alpha/roman (optional "("), then "." or ")"
  const markerRE = /^(?:[\u2022\u00B7\u2219\u25AA\u25CF\-*]|(?:\(?(?:\d+|[A-Za-z]+|[ivxlcdm]+)[.)]))\s*/i;

  function trimFromNode(node){
    if (!node) return false;

    if (node.nodeType === Node.TEXT_NODE){
      const txt = (node.nodeValue || '').replace(/\u00A0/g,' ');
      const m = txt.match(markerRE);
      if (m){
        const rest = txt.slice(m[0].length).replace(/^\s+/, '');
        if (rest.length) {
          node.nodeValue = rest;
        } else {
          // If nothing left, drop this text node entirely
          node.parentNode && node.parentNode.removeChild(node);
        }
        return true;
      }
      return false;
    }

    if (node.nodeType === Node.ELEMENT_NODE){
      // Try to trim inside the first descendant text node
      for (let c=node.firstChild; c; c=c.nextSibling){
        // ditch leading pure-whitespace text nodes as we go
        if (c.nodeType === Node.TEXT_NODE && /^\s*$/.test((c.nodeValue||'').replace(/\u00A0/g,' '))){
          const next = c.nextSibling;
          node.removeChild(c);
          c = next ? next.previousSibling : null;
          continue;
        }
        if (trimFromNode(c)){
          // After trimming, drop any leading 7pt NBSP spacer span(s)
          while (node.firstChild && node.firstChild.nodeType === Node.ELEMENT_NODE){
            const el = node.firstChild;
            const st = (el.getAttribute('style')||'').toLowerCase();
            if (el.tagName === 'SPAN' && /font-size:\s*7pt/.test(st) && /^\s*&nbsp;*\s*$/i.test(el.innerHTML)){
              node.removeChild(el);
              continue;
            }
            break;
          }
          return true;
        }
      }
    }
    return false;
  }

  // Work from the very start of <p>, descending into anchors/spans if needed
  trimFromNode(p.firstChild);

  return p.innerHTML.trim();
}

function convertListsInDoc(doc){
  const root  = doc.body;
  const raw   = Array.from(root.childNodes);

  // Keep only meaningful nodes (skip whitespace-only text nodes)
  const nodes = [];
  for (const n of raw){
    if (n.nodeType === Node.TEXT_NODE){
      if ((n.nodeValue || '').replace(/\s+/g,'') === '') continue;
    }
    nodes.push(n);
  }

  const frag  = doc.createDocumentFragment();

  // Stack of open lists: [{ el, level, type, styleType, lastLi }]
  const stack = [];
  const current = () => stack[stack.length-1];

  // Remember the most recent emitted <li> (for "carry-over" nesting)
  let lastLiGlobal = null;

  const olStyle = el => (el && el.style && el.style.listStyleType) || 'decimal';
  const styleRank = (type, styleType)=>{
    if (type !== 'ol') return 0;
    const st = (styleType || 'decimal').toLowerCase();
    if (st.includes('roman')) return 2;
    if (st.includes('alpha')) return 1;
    return 0; // decimal/default
  };

  function pushList(info, parentLi){
    const list = doc.createElement(info.type);
    if (info.styleType) list.style.listStyleType = info.styleType;

    if (parentLi){
      parentLi.appendChild(list);
    } else if (stack.length){
      // attach inside the last <li> of the parent list
      let holder = current().lastLi;
      if (!holder){
        holder = doc.createElement('li');
        current().el.appendChild(holder);
        current().lastLi = holder;
      }
      holder.appendChild(list);
    } else {
      frag.appendChild(list);
    }

    stack.push({
      el: list,
      level: info.level,
      type: info.type,
      styleType: info.styleType || null,
      lastLi: null
    });
  }

  function closeTo(level){
    while (stack.length && current().level > level) stack.pop();
  }

  function isTrivialParagraph(node){
    if (!(node && node.nodeType===Node.ELEMENT_NODE && node.tagName==='P')) return false;
    const txt = (node.textContent||'').replace(/\u00A0/g,' ').trim();
    return txt === '';
  }

  let i = 0;
  while (i < nodes.length){
    const n = nodes[i];

    if (n.nodeType === Node.ELEMENT_NODE && n.tagName === 'P'){
      let info = getListInfo(n);
      if (info){
        // If a list is open, decide nest/pop based on style rank (decimal < alpha < roman)
        if (stack.length){
          const cur = current();
          if (info.type === 'ol' && cur.type === 'ol' && info.level <= cur.level){
            const curRank = styleRank(cur.type, cur.styleType);
            const newRank = styleRank(info.type, info.styleType);
            if (newRank > curRank){
              // decimal -> alpha/roman: go one level deeper
              info.level = cur.level + 1;
            } else if (newRank < curRank){
              // alpha/roman -> decimal: pop one level
              info.level = Math.max(1, cur.level - 1);
            }
          }
          // clamp jumps to at most one deeper
          if (info.level > current().level + 1) info.level = current().level + 1;

        } else if (lastLiGlobal){
          // Stack is empty but previous output was an <li>.
          const parentList = lastLiGlobal.parentElement;
          const parentIsOl = parentList && parentList.tagName === 'OL';
          const parentRank = parentIsOl ? styleRank('ol', olStyle(parentList)) : 0;
          const newRank    = info.type === 'ol' ? styleRank('ol', info.styleType) : 0;
          const prevIntro  = /[:：]\s*$/.test((lastLiGlobal.textContent || ''));

          // Only carry-over nest if rank increases (or previous li ended with ":")
          if (newRank > parentRank || prevIntro){
            info.level = (lastLiGlobal._level || 1) + 1;
            pushList(info, lastLiGlobal);
          }
        }

        // Open/continue the appropriate list at the target level
        if (!stack.length || current().level < info.level || current().type !== info.type){
          pushList(info);
        } else if (
          current().type === 'ol' &&
          (info.styleType || 'decimal') !== (current().styleType || 'decimal')
        ){
          // same level but different numbering → sibling list (not nested)
          closeTo(info.level - 1);
          pushList(info);
        }

        // Emit the <li>
        const li = doc.createElement('li');
        li.innerHTML = stripListMarkersDOM(n.cloneNode(true));
        current().el.appendChild(li);
        current().lastLi = li;
        li._level = current().level;
        lastLiGlobal = li;

        i++;
        continue;
      } else if (stack.length && isTrivialParagraph(n)){
        // ignore blank spacer paragraphs inside lists
        i++;
        continue;
      }
    }

    // For any other node: if it's whitespace-only text we already skipped it above.
    // Close lists only on meaningful non-list content.
    closeTo(0);
    frag.appendChild(n.cloneNode(true));
    i++;
  }

  closeTo(0);
  root.innerHTML = '';
  root.appendChild(frag);
}


function mergeAdjacentLists(doc){
  const root = doc.body;
  let n = root.firstElementChild;
  while (n){
    if (n.tagName==='OL' || n.tagName==='UL'){
      let next = n.nextElementSibling;
      while (next && next.tagName===n.tagName && (next.getAttribute('style')||'')===(n.getAttribute('style')||'')){
        while (next.firstElementChild) n.appendChild(next.firstElementChild);
        const drop = next; next = next.nextElementSibling; drop.remove();
      }
    }
    n = n.nextElementSibling;
  }
}

function stripTableBorders(doc){
  doc.querySelectorAll('table').forEach(tbl=>tbl.removeAttribute('border'));
}
function serialize(doc){ return doc.body.innerHTML.trim(); }

// ===== Pipeline (ORDER MATTERS) =====
function cleanHTML(inputHTML){
  const doc = parseHTML(inputHTML);

  removeHtmlComments(doc);
  removeOfficeNamespaces(doc);
  removeDangerousNodes(doc);

  convertMsoHeadings(doc);     // keep Mso* to detect headings
  convertListsInDoc(doc);      // build lists while mso-list/margins still present
  mergeAdjacentLists(doc);

  removeWordComments(doc);
  removeMsoStyling(doc);       // NOW strip Mso* classes & mso-* styles

  normalizeInlineFormatting(doc);
  stripTableBorders(doc);
  return serialize(doc);
}

// ===== UI =====
const outEl=document.getElementById('out');
const iframe=document.getElementById('preview');
const btnShowPreview=document.getElementById('btnShowPreview');
const btnShowCode=document.getElementById('btnShowCode');
const btnCopy=document.getElementById('btnCopy');

async function copyHtml(){
  const text = (outEl?.textContent || '').trim() || (iframe?.srcdoc || '');
  if (!text) {
    // quick UX hint
    const old = btnCopy.textContent; btnCopy.textContent='Nothing to copy';
    btnCopy.disabled = true; setTimeout(()=>{btnCopy.textContent=old;btnCopy.disabled=false;}, 900);
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    const old = btnCopy.textContent; btnCopy.textContent='Copied!';
    btnCopy.disabled = true; setTimeout(()=>{btnCopy.textContent=old;btnCopy.disabled=false;}, 900);
  } catch {
    // fallback for older/non-https contexts
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
    const old = btnCopy.textContent; btnCopy.textContent='Copied!';
    btnCopy.disabled = true; setTimeout(()=>{btnCopy.textContent=old;btnCopy.disabled=false;}, 900);
  }
}

btnCopy.addEventListener('click', copyHtml);


function setView(view){
  const isPreview=view==='preview';
  btnShowPreview.setAttribute('aria-pressed', String(isPreview));
  btnShowCode.setAttribute('aria-pressed', String(!isPreview));
  iframe.classList.toggle('hidden', !isPreview);
  outEl.classList.toggle('hidden', isPreview);
}
// default to Preview
setView('preview');

// toggle handlers
btnShowPreview.addEventListener('click',()=>setView('preview'));
btnShowCode.addEventListener('click',()=>setView('code'));

// actions
document.getElementById('btnClean').addEventListener('click',()=>{
  const input=document.getElementById('pasteZone').innerHTML;
  const cleaned=cleanHTML(input);
  outEl.textContent=cleaned;
  iframe.srcdoc=cleaned;
});

document.getElementById('btnClear').addEventListener('click',()=>{
  document.getElementById('pasteZone').innerHTML='';
  outEl.textContent='';
  iframe.srcdoc='';
});
</script>

</body>
</html>
